services:
  postgres:
    image: postgres:16
    container_name: labrat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: labrat
      POSTGRES_PASSWORD: labrat_dev
      POSTGRES_DB: labrat
    ports:
      - "${LABRAT_POSTGRES_PORT:-5433}:5432"
    volumes:
      - labrat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labrat -d labrat"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: labrat-backend
    restart: unless-stopped
    init: true
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://labrat:labrat_dev@postgres:5432/labrat
      SESSION_SECRET: dev-secret
      LABRAT_SEED_DEV_ACCOUNTS: "true"
      PORT: "8787"
      HOST: 0.0.0.0
      LABRAT_AI_PROVIDER: "${LABRAT_AI_PROVIDER:?Set LABRAT_AI_PROVIDER to anthropic or deepseek}"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      LABRAT_ANALYSIS_EXECUTOR: local
      LABRAT_ANALYSIS_PYTHON_COMMAND: python3
    ports:
      - "8787:8787"
    volumes:
      - ./:/app
      - labrat_backend_node_modules:/app/backend/node_modules
      - labrat_backend_files:/app/backend/.labrat-files
    command: >
      sh -c "if [ ! -d backend/node_modules/pg ]; then
      npm --prefix backend install;
      fi
      && npm --prefix backend run migrate
      && npm --prefix backend run dev:v1"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  frontend:
    image: node:24-alpine
    container_name: labrat-frontend
    restart: unless-stopped
    init: true
    working_dir: /app
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_LABRAT_DATA_MODE: blank
      VITE_LABRAT_API_PROXY_TARGET: http://backend:8787
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - labrat_frontend_node_modules:/app/node_modules
    command: >
      sh -c "if [ ! -x node_modules/.bin/vite ]; then
      npm install;
      fi
      && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/LabRat/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  labrat_pgdata:
  labrat_backend_node_modules:
  labrat_backend_files:
  labrat_frontend_node_modules:
