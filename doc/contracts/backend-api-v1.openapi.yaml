      schema: { $ref: "#/components/schemas/OpaqueId" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 200, pattern: "^[A-Za-z0-9._:-]+$" }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, maxLength: 500 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    PageLimit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
  responses:
    Unauthorized:
      description: Authentication is missing or expired.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: The actor lacks the required capability.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Resource not found in the authorized scope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: Version, state, stale-head or idempotency conflict.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationError:
      description: Request failed bounded validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    AnalysisCapabilitiesObject:
      description: Public model/executor readiness and bounded accepted-data counts.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AnalysisCapabilities" }
    AgentRunPage:
      description: Bounded AgentRun summaries.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentRunPage" }
    AgentRunObject:
      description: One public AgentRun summary.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentRunResponse" }
    CreateAgentRunResult:
      description: Routed reply plus optional durable reviewed-analysis artifacts.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CreateAgentRunResponse" }
    AnalysisThreadPage:
      description: Bounded analysis-thread summaries.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AnalysisThreadPage" }
    AnalysisThreadObject:
      description: One analysis-thread summary.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AnalysisThreadResponse" }
    AnalysisThreadDetailObject:
      description: Thread detail with bounded visible messages, plan revisions and runs.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AnalysisThreadDetail" }
    AnalysisPlanRevisionObject:
      description: One immutable reviewable analysis-plan revision.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AnalysisPlanRevisionResponse" }
    AnalysisThreadRetryObject:
      description: Evidence-recovery retry result.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AnalysisThreadRetryResponse" }
    AnalysisSelectionObject:
      description: Reviewed source/snapshot selections without result values or Python.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AnalysisSelection" }
    AnalysisWorkflowObject:
      description: Accepted plan or immutable run-retry workflow state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AnalysisWorkflowResponse" }
    AnalysisWorkflowWithResultObject:
      description: Execution state and optional immutable validated result summary.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AnalysisWorkflowWithResultResponse" }
    AnalysisRunDetailObject:
      description: One run with its accepted plan, thread and optional result summary.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AnalysisRunDetail" }
    AnalysisResultPreviewObject:
      description: Target-specific bounded review payload; never generated Python or run inputs.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AnalysisResultPreview" }
    AnalysisRevisionObject:
      description: Later immutable plan revision linked to the prior run/result.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AnalysisRevisionResponse" }
    AnalysisChartPublicationObject:
      description: Atomic exact-result ChartSpec publication.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AnalysisChartPublicationResponse" }
    ExperimentAnalysisPublicationObject:
      description: Atomic exact-result DataSnapshot/Experiment Browser publication.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ExperimentAnalysisPublicationResponse" }
    ChartSpecPage:
      description: Bounded ChartSpec summaries without Plotly point arrays.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ChartSpecPage" }
    ChartSpecObject:
      description: One complete immutable ChartSpec.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ChartSpecResponse" }
    ManuscriptPage:
      description: Bounded editable manuscript page.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ManuscriptPage" }
    ManuscriptObject:
      description: One editable manuscript.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ManuscriptResponse" }
    UserPage:
      description: Cursor page of users.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/CursorPage"
              - type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
    LabPage:
      description: Cursor page of Labs.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/CursorPage"
              - type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Lab" }
    ProjectPage:
      description: Authorization-filtered cursor page of Projects.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/CursorPage"
              - type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
    GroupPage:
      description: Cursor page of Lab groups.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/CursorPage"
              - type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LabGroup" }
    AccessGrantPage:
      description: Cursor page of project and experiment grants.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/CursorPage"
              - type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AccessGrant" }
    LabMemberPage:
      description: Cursor page of active Lab memberships.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/CursorPage"
              - type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LabMember" }
    DataPlanPage:
      description: Accepted historical DataPlan summaries for a fully authorized Project.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/CursorPage"
              - type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DataPlanSummary" } }
    DataSnapshotPage:
      description: Accepted DataSnapshot summaries restricted to the actor's experiment scope.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/CursorPage"
              - type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/DataSnapshotSummary" } }
    ExperimentAnnotationPage:
      description: Current actor's annotations in the authorized experiment scope.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/CursorPage"
              - type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ExperimentAnnotation" } }
    ExperimentAnnotationObject:
      description: Saved personal Experiment annotation.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [annotation]
            properties:
              annotation: { $ref: "#/components/schemas/ExperimentAnnotation" }
    ExperimentCustomColumnPage:
      description: Custom Browser columns visible in the authorized experiment scope.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/CursorPage"
              - type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ExperimentCustomColumn" } }
    ExperimentCustomColumnObject:
      description: Experiment Browser custom column.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [customColumn]
            properties:
              customColumn: { $ref: "#/components/schemas/ExperimentCustomColumn" }
    ExperimentCustomValueObject:
      description: Versioned custom value for one Experiment and custom column.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [customValue]
            properties:
              customValue: { $ref: "#/components/schemas/ExperimentCustomValue" }
    ProjectBrowserConfigObject:
      description: Shared Browser configuration and edit capability.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ProjectBrowserConfigResponse" }
    BrowserViewPage:
      description: Current actor's personal Browser views.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/CursorPage"
              - type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/BrowserView" } }
    BrowserViewObject:
      description: Current actor's personal Browser view.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [browserView]
            properties:
              browserView: { $ref: "#/components/schemas/BrowserView" }
    DeletedResponse:
      description: Deletion result.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [deleted]
            properties:
              deleted: { type: boolean }
    FileObjectPage:
      description: Project file evidence.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FileObjectPage" }
    FileUploadResult:
      description: A newly stored file or an idempotently reused file.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FileUploadResponse" }
    ImportRunPage:
      description: Project import scans.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ImportRunPage" }
    ImportRunObject:
      description: Import scan created.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ImportRunResponse" }
    SourceDocumentPage:
      description: Immutable source-document indexes for the project.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SourceDocumentPage" }
    WorkbookReviewSessionPage:
      description: Active workbook review sessions.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WorkbookReviewSessionPage" }
    WorkbookReviewSessionCreated:
      description: Workbook review session and its deterministic candidate regions.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WorkbookReviewSessionCreateResponse" }
    RegionUnderstandingPage:
      description: Accepted region-understanding decisions.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RegionUnderstandingPage" }
    SourceRegionPage:
      description: Indexed regions in one SourceDocument.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SourceRegionPage" }
    SourceQueryResult:
      description: Bounded SourceDocument search results.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SourceQueryResponse" }
    SourceRangeResult:
      description: Bounded source cells with both flat cells and row-major compatibility views.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SourceRangeResponse" }
    WorkbookReviewSessionDetail:
      description: Review session with source and region context.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WorkbookReviewSessionDetailResponse" }
    WorkbookReviewSessionDeleted:
      description: Soft-deleted review session and cascaded active-region count.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WorkbookReviewSessionDeleteResponse" }
    WorkbookReviewRegionPage:
      description: Review regions for one workbook review session.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WorkbookReviewRegionPage" }
    WorkbookReviewRegionObject:
      description: One workbook review region.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WorkbookReviewRegionResponse" }
    WorkbookReviewRegionMutation:
      description: Region interpretation or revision result.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WorkbookReviewRegionMutationResponse" }
    RegionUnderstandingRevisionPage:
      description: Immutable interpretation revisions for one review region.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RegionUnderstandingRevisionPage" }
    WorkbookReviewRegionConfirmed:
      description: Region whose current revision was accepted by a reviewer.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/WorkbookReviewRegionConfirmResponse" }
  schemas:
    OpaqueId:
      type: string
      minLength: 1
      maxLength: 200
    Timestamp:
      type: string
      format: date-time
    Capability:
      type: string
      enum: [read, propose, approve, export, manage_access]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code: { type: string, minLength: 1, maxLength: 100 }
            message: { type: string, minLength: 1, maxLength: 1000 }
            requestId: { type: string, minLength: 1, maxLength: 200 }
            details:
              type: object
              additionalProperties: true
    OkResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok: { type: boolean, const: true }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [ok, service, apiVersion]
      properties:
        ok: { type: boolean, const: true }
        service: { type: string, const: labrat-backend }
        apiVersion: { type: string, const: v1 }
    CursorPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, items: {} }
        nextCursor:
          oneOf:
            - type: string
            - type: "null"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 200 }
        password: { type: string, minLength: 1, maxLength: 1000 }
    User:
      type: object
      additionalProperties: false
      required: [id, username, displayName, isActive, isSuperAdmin]
      properties:
        id: { $ref: "#/components/schemas/OpaqueId" }
        username: { type: string }
        displayName: { type: string }
        isActive: { type: boolean }
        isSuperAdmin: { type: boolean }
    LabMembership:
      type: object
      additionalProperties: false
      required: [labId, role, status]
      properties:
        labId: { $ref: "#/components/schemas/OpaqueId" }
        role: { type: string, enum: [lab_owner, lab_admin, lab_member] }
        status: { type: string, enum: [active, inactive] }
    LabMember:
      type: object
      additionalProperties: false
      required: [user, role, status]
      properties:
        user: { $ref: "#/components/schemas/User" }
        role: { type: string, enum: [lab_owner, lab_admin, lab_member] }
        status: { type: string, enum: [active, inactive] }
    UpsertLabMemberRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { type: string, enum: [lab_admin, lab_member] }
    LabMembershipResponse:
      type: object
      additionalProperties: false
      required: [membership]
      properties:
        membership:
          type: object
          additionalProperties: false
          required: [userId, role, status]
          properties:
            userId: { $ref: "#/components/schemas/OpaqueId" }
            role: { type: string, enum: [lab_admin, lab_member] }
            status: { type: string, enum: [active] }
    AuthResponse:
      type: object
      additionalProperties: false
      required: [user, memberships]
      properties:
        user: { $ref: "#/components/schemas/User" }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/LabMembership" }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 200 }
        displayName: { type: string, minLength: 1, maxLength: 300 }
        password: { type: string, minLength: 12, maxLength: 1000 }
        isSuperAdmin: { type: boolean, default: false }
    UpdateUserRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 300 }
        isActive: { type: boolean }
        isSuperAdmin: { type: boolean }
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 12, maxLength: 1000 }
    UserResponse:
      type: object
      additionalProperties: false
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/User" }
    Lab:
      type: object
      additionalProperties: false
      required: [id, name, slug, status]
      properties:
        id: { $ref: "#/components/schemas/OpaqueId" }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [active, inactive] }
        role: { type: string, enum: [lab_owner, lab_admin, lab_member] }
    CreateLabRequest:
      type: object
      additionalProperties: false
      required: [name, slug, ownerUserId]
      properties:
        name: { type: string, minLength: 1, maxLength: 300 }
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        ownerUserId: { $ref: "#/components/schemas/OpaqueId" }
    LabResponse:
      type: object
      additionalProperties: false
      required: [lab]
      properties:
        lab: { $ref: "#/components/schemas/Lab" }
    ProjectProfile:
      type: object
      additionalProperties: false
      properties:
        schemaVersion: { type: string, const: labrat.projectProfile.v1 }
        researchGoal: { type: string, maxLength: 20000 }
        experimentBackground: { type: string, maxLength: 20000 }
        materials: { type: string, maxLength: 20000 }
        methods: { type: string, maxLength: 20000 }
        instruments: { type: string, maxLength: 20000 }
        analysisNotes: { type: string, maxLength: 20000 }
        tags:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 200 }
    ProjectWorkflowSummary:
      type: object
      additionalProperties: false
      required: [publishedExperimentCount, chartSpecCount, chartStyleProfileCount, reusableChartTemplateCount]
      properties:
        publishedExperimentCount: { type: integer, minimum: 0 }
        chartSpecCount: { type: integer, minimum: 0 }
        chartStyleProfileCount: { type: integer, minimum: 0 }
        reusableChartTemplateCount: { type: integer, minimum: 0 }
    Project:
      type: object
      additionalProperties: false
      required: [id, labId, name, description, status]
      properties:
        id: { $ref: "#/components/schemas/OpaqueId" }
        labId: { $ref: "#/components/schemas/OpaqueId" }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, archived] }
        projectProfile: { $ref: "#/components/schemas/ProjectProfile" }
        shellOnly: { type: boolean, default: false }
        capabilities:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Capability" }
        workflowSummary: { $ref: "#/components/schemas/ProjectWorkflowSummary" }
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [labId, name]
      properties:
        labId: { $ref: "#/components/schemas/OpaqueId" }
        name: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 5000, default: "" }
        projectProfile: { $ref: "#/components/schemas/ProjectProfile" }
    UpdateProjectRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 5000 }
        status: { type: string, enum: [active, archived] }
    ProjectResponse:
      type: object
      additionalProperties: false
      required: [project]
      properties:
        project: { $ref: "#/components/schemas/Project" }
    LabGroup:
      type: object
      additionalProperties: false
      required: [id, labId, name, description, status, memberUserIds]
      properties:
        id: { $ref: "#/components/schemas/OpaqueId" }
        labId: { $ref: "#/components/schemas/OpaqueId" }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, inactive] }
        memberUserIds:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/OpaqueId" }
    CreateGroupRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 2000, default: "" }
    UpdateGroupRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 2000 }
        status: { type: string, enum: [active, inactive] }
    GroupResponse:
      type: object
      additionalProperties: false
      required: [group]
      properties:
        group: { $ref: "#/components/schemas/LabGroup" }
    AccessSubject:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: { type: string, enum: [user, group] }
        id: { $ref: "#/components/schemas/OpaqueId" }
    AccessGrant:
      type: object
      additionalProperties: false
      required: [id, labId, projectId, subject, scope, capabilities, experimentIds, status]
      properties:
        id: { $ref: "#/components/schemas/OpaqueId" }
        labId: { $ref: "#/components/schemas/OpaqueId" }
        projectId: { $ref: "#/components/schemas/OpaqueId" }
        subject: { $ref: "#/components/schemas/AccessSubject" }
        scope: { type: string, enum: [all_experiments, selected_experiments] }
        capabilities:
          type: array
          uniqueItems: true
          minItems: 1
          items: { $ref: "#/components/schemas/Capability" }
        experimentIds:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/OpaqueId" }
        status: { type: string, enum: [active, inactive] }
    CreateAccessGrantRequest:
      type: object
      additionalProperties: false
      required: [subject, scope, capabilities]
      properties:
        subject: { $ref: "#/components/schemas/AccessSubject" }
        scope: { type: string, enum: [all_experiments, selected_experiments] }
        capabilities:
          type: array
          uniqueItems: true
          minItems: 1
          items: { $ref: "#/components/schemas/Capability" }
        experimentIds:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/OpaqueId" }
    AccessGrantResponse:
      type: object
      additionalProperties: false
      required: [grant]
      properties:
        grant: { $ref: "#/components/schemas/AccessGrant" }
    EffectiveAccess:
      type: object
      additionalProperties: false
      required: [projectId, shellOnly, capabilities, allExperiments, experimentIds]
      properties:
        projectId: { $ref: "#/components/schemas/OpaqueId" }
        shellOnly: { type: boolean }
        capabilities:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Capability" }
        allExperiments: { type: boolean }
        experimentIds:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/OpaqueId" }
    EffectiveAccessResponse:
      type: object
      additionalProperties: false
      required: [access]
      properties:
        access: { $ref: "#/components/schemas/EffectiveAccess" }
    NullableString:
      oneOf:
        - type: string
        - type: "null"
    NullableTimestamp:
      oneOf:
        - { $ref: "#/components/schemas/Timestamp" }
        - type: "null"
    NullableOpaqueId:
      oneOf:
        - { $ref: "#/components/schemas/OpaqueId" }
        - type: "null"
    JsonValue:
      oneOf:
        - type: "null"
        - type: boolean
        - type: number
        - type: string
        - type: array
          items: { $ref: "#/components/schemas/JsonValue" }
        - type: object
          additionalProperties: { $ref: "#/components/schemas/JsonValue" }
    JsonObject:
      type: object
      additionalProperties: { $ref: "#/components/schemas/JsonValue" }
    SourceRef:
      type: object
      additionalProperties: false
      required: [sourceType]
      properties:
        sourceType: { type: string }
        sourceDocumentId: { $ref: "#/components/schemas/NullableOpaqueId" }
