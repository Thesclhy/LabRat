openapi: 3.1.0
info:
  title: LabRat Backend API
  version: 1.0.0
  description: >-
    Contract-first API for the NestJS modular monolith. All documented
    operations have closed DTOs and authoritative v1 behavior.
servers:
  - url: http://127.0.0.1:8788
    description: Local v1 development server
tags:
  - name: Platform
  - name: Identity
  - name: Tenancy
  - name: Authorization
  - name: Evidence
  - name: Experiment
  - name: Analysis
  - name: Charts
  - name: Manuscripts
security:
  - cookieAuth: []
paths:
  /health:
    get:
      tags: [Platform]
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/auth/login:
    post:
      tags: [Identity]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/logout:
    post:
      tags: [Identity]
      operationId: logout
      responses:
        "200":
          description: Session revoked and cookie cleared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/auth/me:
    get:
      tags: [Identity]
      operationId: getCurrentUser
      responses:
        "200":
          description: Current user and accessible Lab summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/admin/labs:
    get:
      tags: [Tenancy]
      operationId: listAdminLabs
      x-labrat-capability: platform_admin
      responses:
        "200": { $ref: "#/components/responses/LabPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Tenancy]
      operationId: createLab
      x-labrat-capability: platform_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLabRequest"
      responses:
        "201":
          description: Lab created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabResponse"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/users:
    get:
      tags: [Identity]
      operationId: listAdminUsers
      x-labrat-capability: platform_admin
      responses:
        "200": { $ref: "#/components/responses/UserPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Identity]
      operationId: createUser
      x-labrat-capability: platform_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/admin/users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    patch:
      tags: [Identity]
      operationId: updateUser
      x-labrat-capability: platform_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/admin/users/{userId}/reset-password:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      tags: [Identity]
      operationId: resetUserPassword
      x-labrat-capability: platform_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password replaced and existing sessions revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/labs:
    get:
      tags: [Tenancy]
      operationId: listMyLabs
      responses:
        "200": { $ref: "#/components/responses/LabPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/labs/{labId}/members:
    parameters:
      - $ref: "#/components/parameters/LabId"
    get:
      tags: [Authorization]
      operationId: listLabMembers
      x-labrat-capability: manage_access
      responses:
        "200": { $ref: "#/components/responses/LabMemberPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/labs/{labId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/LabId"
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [Authorization]
      operationId: upsertLabMember
      x-labrat-capability: manage_access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertLabMemberRequest"
      responses:
        "200":
          description: Membership created or reactivated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabMembershipResponse"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Authorization]
      operationId: deactivateLabMember
      x-labrat-capability: manage_access
      responses:
        "200":
          description: Membership deactivated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/projects:
    get:
      tags: [Tenancy]
      operationId: listProjects
      x-labrat-capability: read
      parameters:
        - $ref: "#/components/parameters/LabIdQuery"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { $ref: "#/components/responses/ProjectPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Tenancy]
      operationId: createProject
      x-labrat-capability: lab_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created with rollback-compatible legacy grants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Tenancy]
      operationId: getProject
      x-labrat-capability: read
      responses:
        "200":
          description: Full or minimum authorized Project shell.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tenancy]
      operationId: updateProject
      x-labrat-capability: propose
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Project updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects/{projectId}/profile:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    patch:
      tags: [Tenancy]
      operationId: updateProjectProfile
      x-labrat-capability: propose
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectProfile"
      responses:
        "200":
          description: Project profile updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/labs/{labId}/groups:
    parameters:
      - $ref: "#/components/parameters/LabId"
    get:
      tags: [Authorization]
      operationId: listLabGroups
      x-labrat-capability: manage_access
      responses:
        "200": { $ref: "#/components/responses/GroupPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Authorization]
      operationId: createLabGroup
      x-labrat-capability: manage_access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Group created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/labs/{labId}/groups/{groupId}:
    parameters:
      - $ref: "#/components/parameters/LabId"
      - $ref: "#/components/parameters/GroupId"
    patch:
      tags: [Authorization]
      operationId: updateLabGroup
      x-labrat-capability: manage_access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupRequest"
      responses:
        "200":
          description: Group updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Authorization]
      operationId: deleteLabGroup
      x-labrat-capability: manage_access
      responses:
        "200":
          description: Group disabled and grants no longer authorize access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/labs/{labId}/groups/{groupId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/LabId"
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [Authorization]
      operationId: addLabGroupMember
      x-labrat-capability: manage_access
      responses:
        "200":
          description: Active Lab member added idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Authorization]
      operationId: removeLabGroupMember
      x-labrat-capability: manage_access
      responses:
        "200":
          description: Group membership removed idempotently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects/{projectId}/access-grants:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Authorization]
      operationId: listProjectAccessGrants
      x-labrat-capability: manage_access
      responses:
        "200": { $ref: "#/components/responses/AccessGrantPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Authorization]
      operationId: createProjectAccessGrant
      x-labrat-capability: manage_access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccessGrantRequest"
      responses:
        "201":
          description: Project and optional experiment grants created atomically.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessGrantResponse"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/projects/{projectId}/access-grants/{grantId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/GrantId"
    delete:
      tags: [Authorization]
      operationId: deleteProjectAccessGrant
      x-labrat-capability: manage_access
      responses:
        "200":
          description: Grant disabled and no longer authorizes access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects/{projectId}/access:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [Authorization]
      operationId: getEffectiveProjectAccess
      x-labrat-capability: read
      responses:
        "200":
          description: Current actor's effective capabilities and experiment scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveAccessResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/projects/{projectId}/analysis-capabilities:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [Analysis]
      operationId: getAnalysisCapabilities
      x-labrat-capability: read
      x-labrat-scope: all_experiments
      responses:
        "200": { $ref: "#/components/responses/AnalysisCapabilitiesObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects/{projectId}/evidence/retrieve:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    post:
      tags: [Evidence]
      operationId: retrieveAcceptedEvidence
      x-labrat-capability: read
      x-labrat-scope: all_experiments
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetrieveEvidenceRequest" }
      responses:
        "200":
          description: Bounded retrieval from accepted RegionUnderstandingRevisions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceRetrievalResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects/{projectId}/data-plans:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [Experiment]
      operationId: listDataPlans
      x-labrat-capability: read_full_project
      responses:
        "200": { $ref: "#/components/responses/DataPlanPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects/{projectId}/data-snapshots:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [Experiment]
      operationId: listDataSnapshots
      x-labrat-capability: read
      responses:
        "200": { $ref: "#/components/responses/DataSnapshotPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects/{projectId}/experiment-browser:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [Experiment]
      operationId: getExperimentBrowser
      x-labrat-capability: read
      parameters:
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 500 } }
        - { name: filters, in: query, required: false, schema: { type: string, maxLength: 20000 } }
        - { name: sort, in: query, required: false, schema: { type: string, maxLength: 10000 } }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 250 } }
        - { name: starredOnly, in: query, required: false, schema: { type: string, enum: ["true", "false"] } }
      responses:
        "200":
          description: Authorization-filtered Experiment Browser projection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExperimentProjection" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects/{projectId}/experiments/{experimentId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/ExperimentId" }
    get:
      tags: [Experiment]
      operationId: getExperimentDetail
      x-labrat-capability: read_experiment
      responses:
        "200":
          description: Active accepted record and immutable snapshot provenance for one Experiment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExperimentDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects/{projectId}/experiment-annotations:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [Experiment]
      operationId: listExperimentAnnotations
      x-labrat-capability: read
      responses:
        "200": { $ref: "#/components/responses/ExperimentAnnotationPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects/{projectId}/experiments/{experimentId}/annotation:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/ExperimentId" }
    put:
      tags: [Experiment]
      operationId: saveExperimentAnnotation
      x-labrat-capability: read_experiment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveExperimentAnnotationRequest" }
      responses:
        "200": { $ref: "#/components/responses/ExperimentAnnotationObject" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Experiment]
      operationId: deleteExperimentAnnotation
      x-labrat-capability: read_experiment
      responses:
        "200": { $ref: "#/components/responses/DeletedResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects/{projectId}/experiment-custom-columns:
    parameters: [{ $ref: "#/components/parameters/ProjectId" }]
    get:
      tags: [Experiment]
      operationId: listExperimentCustomColumns
      x-labrat-capability: read
      responses:
        "200": { $ref: "#/components/responses/ExperimentCustomColumnPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Experiment]
      operationId: createExperimentCustomColumn
      x-labrat-capability: propose_full_project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateExperimentCustomColumnRequest" }
      responses:
        "201": { $ref: "#/components/responses/ExperimentCustomColumnObject" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/projects/{projectId}/experiment-custom-columns/{columnId}:
    parameters:
      - { $ref: "#/components/parameters/ProjectId" }
      - { $ref: "#/components/parameters/ColumnId" }
    patch:
      tags: [Experiment]
      operationId: updateExperimentCustomColumn
      x-labrat-capability: propose_full_project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateExperimentCustomColumnRequest" }
      responses:
        "200": { $ref: "#/components/responses/ExperimentCustomColumnObject" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Experiment]
      operationId: deleteExperimentCustomColumn
